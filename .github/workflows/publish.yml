name: Publish to pkg.go.dev

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v1.0.0)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Verify module
        run: go mod tidy && go build ./...

      - name: Test
        run: go test ./...

      - name: Trigger pkg.go.dev indexing
        run: |
          MODULE=$(go list -m)
          curl -s "https://sum.golang.org/lookup/${MODULE}@${{ github.event.inputs.version }}" || true
