name: Tag release
on:
  workflow_dispatch:
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.21" }
      - run: go mod tidy && go test ./...
      # Go modules are published by tagging — no push step needed.
      # The tag created by the GitHub release triggers pkg.go.dev indexing.
